services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apotek-laravel
    ports:
      - "7000:7000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=apotek
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - apotek-network

  db:
    image: mysql:8.0
    container_name: apotek-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=apotek
      - MYSQL_USER=apotek
      - MYSQL_PASSWORD=secret
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./apotek.sql:/docker-entrypoint-initdb.d/apotek.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - apotek-network

networks:
  apotek-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
    driver_opts:
      type: none
      device: ./data/mysql
      o: bind